name: forkhub linux build

# Linux build for the ImBIOS Natively catalog: stock upstream + with-fh
# update-channel (pinned ref, see manifest depends_on) + linux-support,
# stamped NATIVELY_UPDATE_OWNER=ImBIOS with the ImBIOS Google OAuth
# client, packed as AppImage + deb and published to THIS repo's releases.
#
# Required secrets: NATIVELY_GOOGLE_CLIENT_ID / NATIVELY_GOOGLE_CLIENT_SECRET
# (fork calendar OAuth; without the secret calendar reports not-configured).
# Absent: build still publishes; calendar step warns (see channel INTENT
# non-negotiable 7).

on:
  push:
    paths:
      - "repos/github.com/natively-ai-assistant/natively-cluely-ai-assistant/**"
      - ".github/workflows/forkhub-pr-build.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (empty = newest stable)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the release already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: linux build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [linux]
    steps:
      - uses: actions/checkout@v6
        with:
          path: catalog

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve upstream tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            URL="https://github.com/Natively-AI-assistant/natively-cluely-ai-assistant.git"
            TAG=$(git ls-remote --tags --sort=-v:refname "$URL" \
              | grep -io 'refs/tags/v[^^{}]*' | cut -d/ -f3 | grep -Ev -- '-(beta|alpha|rc|preview|nightly|pr)[.-]' | head -n 1 || true)
            [ -n "$TAG" ] || { echo "::error::no stable upstream tag found"; exit 1; }
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone upstream + apply intent stack
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/app" && mkdir -p "$GITHUB_WORKSPACE/app"
          git clone --depth 1 --branch "${{ steps.tag.outputs.tag }}" \
            https://github.com/Natively-AI-assistant/natively-cluely-ai-assistant.git app
          TDIR="$GITHUB_WORKSPACE/catalog/repos/github.com/natively-ai-assistant/natively-cluely-ai-assistant"
          # Dependency on with-fh/.forkhub (pinned in manifest depends_on):
          # the pin AND the semver range are enforced — a human decides on
          # range failure (never auto-resolve across a MAJOR).
          REF=$(python3 -c "import json; print(json.load(open('$TDIR/manifest.json'))['patches']['natively-linux-support-9d3f7a21'].get('depends_on',[{}])[0].get('ref',''))")
          [ -n "$REF" ] || { echo "::error::no pinned with-fh ref in manifest depends_on"; exit 1; }
          echo "with-fh support at $REF"
          DEP_MANIFEST=$(curl -fsSL "https://raw.githubusercontent.com/with-fh/.forkhub/$REF/repos/github.com/natively-ai-assistant/natively-cluely-ai-assistant/manifest.json")
          DEP_VER=$(printf '%s' "$DEP_MANIFEST" | python3 -c "import json,sys; print(json.load(sys.stdin)['patches']['natively-forkhub-support-f276ae13']['version'])")
          RANGE=$(python3 -c "import json; print(json.load(open('$TDIR/manifest.json'))['patches']['natively-linux-support-9d3f7a21'].get('depends_on',[{}])[0].get('version',''))")
          DEP_VER="$DEP_VER" RANGE="$RANGE" python3 -c '
          import os, sys
          def tup(v):
              return tuple(int(x) for x in ((str(v).split(".") + ["0", "0", "0"])[:3]))
          ver = tup(os.environ["DEP_VER"])
          rng = os.environ.get("RANGE") or ">=0.0.0"
          ok = True
          for part in rng.split():
              if part[:2] in (">=", "<=", "==", "!="):
                  op, want = part[:2], tup(part[2:])
              elif part[:1] in (">", "<"):
                  op, want = part[:1], tup(part[1:])
              else:
                  print("unparseable range part:", part, file=sys.stderr)
                  sys.exit(2)
              if op == "==": ok = ok and ver == want
              elif op == "!=": ok = ok and ver != want
              elif op == ">=": ok = ok and ver >= want
              elif op == "<=": ok = ok and ver <= want
              elif op == ">": ok = ok and ver > want
              elif op == "<": ok = ok and ver < want
          print("dep %s vs %s: %s" % (os.environ["DEP_VER"], rng, "OK" if ok else "MISMATCH"))
          sys.exit(0 if ok else 1)
          ' || { echo "::error::with-fh support $DEP_VER does not satisfy $RANGE - human decision required (see INTENT.md)"; exit 1; }
          echo "dependency range satisfied: support $DEP_VER in $RANGE"
          curl -fsSL "https://raw.githubusercontent.com/with-fh/.forkhub/$REF/repos/github.com/natively-ai-assistant/natively-cluely-ai-assistant/patches/natively-forkhub-support-f276ae13/reference.diff" \
            -o /tmp/withfh-support.diff
          git -C "$GITHUB_WORKSPACE/app" apply --check /tmp/withfh-support.diff
          git -C "$GITHUB_WORKSPACE/app" apply /tmp/withfh-support.diff
          # Layer 2: ImBIOS linux-support (applies on top of the channel patch).
          LINUX="$TDIR/patches/natively-linux-support-9d3f7a21/reference.diff"
          git -C "$GITHUB_WORKSPACE/app" apply --check "$LINUX"
          git -C "$GITHUB_WORKSPACE/app" apply "$LINUX"

      - name: Native prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update >>/tmp/apt.log 2>&1 || true
          sudo apt-get install -y build-essential python3 pkg-config libsecret-1-dev libasound2-dev >>/tmp/apt.log 2>&1 || true

      - name: Install + build + pack AppImage
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
          NATIVELY_UPDATE_OWNER: ImBIOS
          NATIVELY_UPDATE_REPO: .forkhub
          NATIVELY_GOOGLE_CLIENT_ID: ${{ secrets.NATIVELY_GOOGLE_CLIENT_ID }}
          NATIVELY_GOOGLE_CLIENT_SECRET: ${{ secrets.NATIVELY_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/app"
          [ -n "${NATIVELY_GOOGLE_CLIENT_SECRET:-}" ] || echo "::warning::NATIVELY_GOOGLE_CLIENT_SECRET not set — calendar will report not-configured (see channel INTENT non-negotiable 7)."
          npm ci
          export PATH="$PWD/node_modules/.bin:$PATH"
          # Fork provenance version (distinct owner suffix — never collides
          # with with-fh's with-fh.N line).
          BASE=$(printf '%s' "${{ steps.tag.outputs.tag }}" | sed 's/^v//')
          N=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' \
            | grep -cE "^v${BASE}-fh\\.imbios\\.[0-9]+\$" || true)
          VER="${BASE}-fh.imbios.$((N + 1))"
          npm pkg set "version=$VER"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          # Bake the ImBIOS feed default + OAuth client into the packaged
          # app (renderer has no env; the channel patch reads baked
          # extraMetadata first). No-ops when the vars are empty.
          [ -n "${NATIVELY_UPDATE_OWNER:-}" ] && npm pkg set "build.extraMetadata.forkhubUpdateOwner=$NATIVELY_UPDATE_OWNER" || true
          [ -n "${NATIVELY_GOOGLE_CLIENT_ID:-}" ] && npm pkg set "build.extraMetadata.nativelyGoogleClientId=$NATIVELY_GOOGLE_CLIENT_ID" || true
          [ -n "${NATIVELY_GOOGLE_CLIENT_SECRET:-}" ] && npm pkg set "build.extraMetadata.nativelyGoogleClientSecret=$NATIVELY_GOOGLE_CLIENT_SECRET" || true
          npm run build
          npm run build:electron
          npm run build:native || echo "::warning::native module build failed; continuing without it"
          find dist dist-electron node_modules -name '*.map' -delete || true
          ./node_modules/.bin/electron-builder --linux AppImage --publish never

      - name: Publish linux release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$GITHUB_WORKSPACE/app/release"/*.AppImage "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
          mv "$GITHUB_WORKSPACE/app/release"/*.deb "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
          mv "$GITHUB_WORKSPACE/app/release"/latest-linux.yml "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
          mv "$GITHUB_WORKSPACE/app/release"/fh-linux.yml "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
          [ -n "$(ls -A "$GITHUB_WORKSPACE/dist")" ] || { echo "::error::no artifacts packed"; exit 1; }
          TAG="v$APP_VERSION"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum * > SHA256SUMS || shasum -a 256 * > SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ inputs.force }}" != "true" ]; then
              echo "$TAG exists and force=false; uploading into it"
            fi
            # shellcheck disable=SC2086
            (cd "$GITHUB_WORKSPACE/dist" && gh release upload "$TAG" * --repo "$GITHUB_REPOSITORY" --clobber)
          else
            gh release create "$TAG" "$GITHUB_WORKSPACE"/dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Natively Linux $TAG (ImBIOS ForkHub)" \
              --notes "ImBIOS ForkHub Linux build: update-channel (with-fh) + linux-support at upstream ${{ steps.tag.outputs.tag }}. Auto-updates from the ImBIOS catalog."
          fi
          mkdir -p /tmp/prlink
          printf '%s' "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" > "/tmp/prlink/${{ matrix.flavor }}-url.txt"
          printf '%s' "$TAG" > "/tmp/prlink/${{ matrix.flavor }}-tag.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pr-build-link-${{ matrix.flavor }}
          path: /tmp/prlink/
          if-no-files-found: error
